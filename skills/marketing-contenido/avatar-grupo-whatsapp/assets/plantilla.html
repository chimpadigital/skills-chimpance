<title>Avatar grupo WhatsApp · CLIENTE × Chimpancé</title>
<!-- Si el ISO del cliente usa una tipografía web, agregar acá el <link> de Google Fonts.
     Ej: <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800&display=swap" rel="stylesheet"> -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0A0A0A}
  /* lienzo 1080×1080 — Edge headless lo captura entero */
  .stage{width:1080px;height:1080px;background:#0A0A0A;position:relative;overflow:hidden}
  .circle{position:absolute;left:90px;top:90px;width:900px;height:900px;border-radius:50%;overflow:hidden;display:flex}
  .half{width:50%;height:100%;display:flex;align-items:center;justify-content:center}
  .half.cliente{background:#fff}
  .half.chimpa{background:#D9F45F}
  .half.chimpa .pa{width:70%}
  /* el ISO del cliente debe ocupar ~60–70% del ancho de la mitad (mitad = 450px) */
  .half.cliente .iso-cliente{max-width:68%;max-height:60%}
</style>
</head>

        <rect width="100" height="100" rx="18" fill="#888"/>
        <text x="50" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="36" fill="#fff">ISO</text>
